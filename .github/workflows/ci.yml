name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Core regression tests
        run: bash scripts/test.sh
      - name: Build and verify signed app
        run: bash scripts/build-app.sh
